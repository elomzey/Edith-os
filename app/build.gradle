plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://chaquo.com/maven' }
}

android {
    namespace 'com.edith.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.edith.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters "arm64-v8a"
        }

        python {
            // Chaquopy 14 gère Python 3.8 à 3.11.
            version "3.11"
            // Sur GitHub Actions : python3 (3.11 via setup-python).
            // Sur Termux : ./gradlew assembleDebug -PbuildPython=/data/data/com.termux/files/usr/bin/python3.11
            buildPython(project.findProperty("buildPython") ?: "python3")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
